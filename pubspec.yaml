name: artisango
description: A Flutter app to connect clients with local artisans.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  image_picker: ^1.1.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  http: ^1.2.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.0
  in_app_review: ^2.0.0
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1   # ✅ package for changing app icon

flutter_launcher_icons:              # ✅ configuration at root level (not inside dev_dependencies)
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
